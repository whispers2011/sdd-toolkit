name: CI

on:
  push:
    branches: [main]
  pull_request:

# Der Workflow liest nur — kein Schreibzugriff auf das Repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm zuerst: setup-node braucht es für den Dependency-Cache.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # better-sqlite3 und node-pty werden aus Quellen gebaut (onlyBuiltDependencies).
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # Die git-Integrationstests legen echte Repos in mkdtemp an und setzen
      # user.name/user.email pro Repo — eine globale git-Identität ist nicht nötig.
      - run: pnpm test

      - run: pnpm build
